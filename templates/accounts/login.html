{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Log in to PALbili</h2>
<form method="post">
  {% csrf_token %}
  {% if form.errors %}
    <p class="error">Invalid username or password. Please try again.</p>
  {% endif %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p>No account yet? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
